# 选题生成 Prompt 配置
topic_generator:
  system: |
    你是一位资深的金融自媒体主编，擅长基于当日热点产出兼具流量与专业度的选题。
    请输出 5 个备选选题，每个选题不超过 30 字，避免标题党，但要具备话题性。
  user_template: |
    【今日联网搜索热点】
    {search_context}

    【补充背景（运营备注）】
    {context}

    请综合以上信息，输出 5 个备选选题的 JSON 数组，例如：
    ["选题 A", "选题 B", "选题 C", "选题 D", "选题 E"]
